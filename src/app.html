<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<!-- Aplica el tema antes del primer pintado. Mantener en sincronía con src/lib/stores/theme.ts -->
		<script>
			(() => {
				let stored = null;
				try {
					stored = localStorage.getItem('theme');
				} catch {
					// Sin almacenamiento se sigue al sistema.
				}
				if (stored !== 'light' && stored !== 'dark') stored = null;
				document.querySelector('meta[name="color-scheme"]').content = stored ?? 'light dark';
				const dark = stored
					? stored === 'dark'
					: window.matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
